<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineData - Estadísticas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <h1>🎬 CineData</h1>

    <nav class="menu">
      <a href="index.html">Inicio</a>
      <a href="estadisticas.html" aria-current="page">Estadísticas</a>
    </nav>
  </header>

  <main class="panel">
    <h2>Estadísticas por género</h2>

    <form id="form-estadisticas" class="filtros">
      <label for="minimo">Mínimo de películas</label>
      <input type="number" id="minimo" name="minimo" min="1" max="50" step="1" placeholder="Opcional">
      <button type="submit">Aplicar</button>
    </form>

    <p id="estado" class="estado"></p>

    <div class="tabla-contenedor" id="contenedor-tabla" hidden>
      <table class="tabla">
        <thead>
          <tr>
            <th>Género</th>
            <th class="num">Películas</th>
            <th class="num">Nota media</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/estadisticas.js"></script>
</body>
</html>
